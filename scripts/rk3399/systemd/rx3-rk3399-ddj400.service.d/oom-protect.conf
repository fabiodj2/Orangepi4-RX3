[Service]
# Same protection as rx3-rbpi4b-rk3399.service.d/oom-protect.conf, for the
# older stack -- only one of the two ever runs (Conflicts=), but which one
# is live can change, and the kernel's OOM choice should be deliberate
# under either. Install with:
#   sudo mkdir -p /etc/systemd/system/rx3-rk3399-ddj400.service.d
#   sudo cp oom-protect.conf /etc/systemd/system/rx3-rk3399-ddj400.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart rx3-rk3399-ddj400.service
OOMScoreAdjust=-900

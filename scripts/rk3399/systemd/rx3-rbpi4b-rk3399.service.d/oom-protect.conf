[Service]
# Counterpart to music-analyze-heavy@.service's OOMScoreAdjust=900: the
# kernel's OOM choice must be deliberate in both directions. Install with:
#   sudo mkdir -p /etc/systemd/system/rx3-rbpi4b-rk3399.service.d
#   sudo cp oom-protect.conf /etc/systemd/system/rx3-rbpi4b-rk3399.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart rx3-rbpi4b-rk3399.service
OOMScoreAdjust=-900
